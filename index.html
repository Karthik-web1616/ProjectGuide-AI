<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=auth.html">
  <title>ProjectGuide-AI</title>
  <script>
    // Redirect based on login state
    (function () {
      try {
        const user = JSON.parse(localStorage.getItem('aip_currentUser'));
        const profile = JSON.parse(localStorage.getItem('aip_profile'));
        if (user && user.loggedIn) {
          if (user.role === 'faculty') {
            window.location.replace('faculty-dashboard.html');
          } else if (!profile || !profile.skills || Object.keys(profile.skills).length === 0) {
            window.location.replace('profile.html');
          } else {
            window.location.replace('dashboard.html');
          }
        } else {
          window.location.replace('auth.html');
        }
      } catch (e) {
        window.location.replace('auth.html');
      }
    })();
  </script>
</head>
<body></body>
</html>
